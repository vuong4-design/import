name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
      ARCHS: arm64
      THEOS_PLATFORM: iphoneos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew install ldid dpkg
          echo "DPKG_BIN=$(brew --prefix dpkg)/libexec/dpkg" >> "$GITHUB_ENV"
          echo "$(brew --prefix dpkg)/libexec/dpkg" >> "$GITHUB_PATH"

      - name: Setup Theos + Preferences Framework
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

          # Ensure vendor frameworks are available for linking private frameworks like Preferences
          if [ ! -d "$THEOS/vendor/Frameworks/Preferences.framework" ]; then
            git -C "$THEOS" submodule update --init --recursive vendor
          fi

          # Download iOS SDK
          curl -L https://github.com/theos/sdks/releases/download/master/iPhoneOS14.5.sdk.tar.xz | tar -xJ -C "$THEOS/sdks/"

          # Download Preferences headers
          mkdir -p "$THEOS/include/Preferences"
          pushd "$THEOS/include/Preferences"
          curl -LO https://raw.githubusercontent.com/theos/headers/master/Preferences/PSListController.h
          curl -LO https://raw.githubusercontent.com/theos/headers/master/Preferences/PSSpecifier.h
          curl -LO https://raw.githubusercontent.com/theos/headers/master/Preferences/PSTableCell.h
          curl -LO https://raw.githubusercontent.com/theos/headers/master/Preferences/PSViewController.h
          curl -LO https://raw.githubusercontent.com/theos/headers/master/Preferences/Preferences.h
          popd

          # Create Preferences framework stub if missing
          if [ ! -d "$THEOS/vendor/Frameworks/Preferences.framework" ]; then
            mkdir -p "$THEOS/vendor/Frameworks/Preferences.framework"
            printf '%s\n' \
              '--- !tapi-tbd-v3' \
              'archs:           [ arm64, arm64e ]' \
              "uuids:           [ 'arm64: 00000000-0000-0000-0000-000000000000' ]" \
              'platform:        ios' \
              'install-name:    /System/Library/PrivateFrameworks/Preferences.framework/Preferences' \
              'exports:' \
              '  - archs:       [ arm64, arm64e ]' \
              '    symbols:     [ _OBJC_CLASS_$_PSListController, _OBJC_CLASS_$_PSSpecifier ]' \
              > "$THEOS/vendor/Frameworks/Preferences.framework/Preferences.tbd"
          fi
          if [ ! -e "$THEOS/vendor/lib/libPreferences.dylib" ]; then
            mkdir -p "$THEOS/vendor/lib"
            printf '%s\n' 'void PSListController() {}' > "$THEOS/vendor/lib/stub.c"
            clang -dynamiclib -o "$THEOS/vendor/lib/libPreferences.dylib" "$THEOS/vendor/lib/stub.c"
            rm "$THEOS/vendor/lib/stub.c"
          fi

          echo "$THEOS/bin" >> "$GITHUB_PATH"
          SDK_VERSION="14.5"
          echo "SDKVERSION=$SDK_VERSION" >> "$GITHUB_ENV"
          echo "TARGET=iphone:clang:$SDK_VERSION:12.0" >> "$GITHUB_ENV"

      - name: Ensure dm.pl is available
        run: |
          if ! command -v dm.pl >/dev/null; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/dm.pl -o "$HOME/.local/bin/dm.pl"
            chmod +x "$HOME/.local/bin/dm.pl"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Build packages
        run: |
          ./build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages/*.deb
